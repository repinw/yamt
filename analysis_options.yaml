include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: 3.1.3

analyzer:
  exclude:
    - '**/*.g.dart'
    - 'lib/l10n/*.dart'
    - 'lib/firebase_options.dart'

linter:
  rules:
    avoid_print: true
    avoid_relative_lib_imports: true
    unnecessary_await_in_return: true
    use_super_parameters: true
