include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: 3.1.9
  architecture_lints:
    path: tools/architecture_lints

analyzer:
  exclude:
    - '**/*.g.dart'
    - 'lib/l10n/*.dart'
    - 'lib/firebase_options.dart'
    - build/**
    - android/**
    - ios/**
    - macos/**

linter:
  rules:
    avoid_print: true
    avoid_relative_lib_imports: true
    use_super_parameters: true
