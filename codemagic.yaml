workflows:
  # Compiles the iOS app and its HomeDiaryWidget extension without signing.
  # Catches Swift and Xcode project errors; produces no installable build.
  # Runs for every pushed tag that starts with "v" (for example v3.4.0);
  # it can also be started by hand in Codemagic.
  ios-unsigned-build:
    name: iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      flutter: 3.47.5
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
