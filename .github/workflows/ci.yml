name: CI

on:
  pull_request:
  # A release tag runs every integration test. A push to master runs one
  # integration test, only to fill the caches: GitHub Actions caches that
  # pull requests can read must be written on master.
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      all:
        description: Run every integration test
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  unit:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: |
          flutter pub get
          (cd tools/architecture_lints && dart pub get)

      - name: Analyze
        run: flutter analyze lib test integration_test

      # `flutter analyze <directory>` does not report analyzer plugin lints
      # such as max_file_lines, so the changed files are analyzed one by one.
      - name: No new lints in changed files
        run: tool/ci_changed_file_lints.sh origin/${{ github.base_ref || 'master' }}

      - name: Unit and widget tests
        run: flutter test

  integration-targets:
    name: List integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      carried: ${{ steps.list.outputs.carried }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pull requests run only the tests whose imports reach a changed file.
      # After a new push to a pull request, a test that passed on the previous
      # push and whose imports did not change since is carried over, not run.
      - id: list
        env:
          RUN_ALL: ${{ github.ref_type == 'tag' || inputs.all == true }}
          WARM_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          BASE_REF: origin/${{ github.base_ref || 'master' }}
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '[]' >carried.json
          if [ "$RUN_ALL" = "true" ]; then
            targets=$(tool/ci_integration_targets.py --all)
          elif [ "$WARM_CACHE" = "true" ]; then
            targets=$(tool/ci_integration_targets.py --all | jq -c '.[:1]')
          else
            args=("$BASE_REF" --carried-out carried.json)
            if [ -n "$BEFORE_SHA" ] &&
              tool/ci_previous_integration_passes.sh "$BEFORE_SHA" >passed.txt; then
              args+=(--since "$BEFORE_SHA" --passed passed.txt)
            fi
            targets=$(tool/ci_integration_targets.py "${args[@]}")
          fi
          carried=$(jq -c . carried.json)
          echo "Selected integration tests: $targets"
          echo "Passed on the previous push, not run again: $carried"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "carried=$carried" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (${{ matrix.target }})
    needs: integration-targets
    if: needs.integration-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.integration-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # The emulator runner downloads the emulator and the system image
      # itself and fails on a broken download ("Error on ZipFile unknown
      # archive"). Installing both here first, with retries, makes the
      # runner's own install a no-op.
      - name: Install the Android emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          image='system-images;android-35;google_apis;x86_64'
          for attempt in 1 2 3; do
            if output=$("$sdkmanager" --install emulator "$image" --channel=0 2>&1) &&
              ! grep -q 'An error occurred' <<<"$output" &&
              [ -x "$ANDROID_HOME/emulator/emulator" ] &&
              [ -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64" ]; then
              exit 0
            fi
            echo "Android SDK install failed on attempt $attempt:" >&2
            grep -v '^\[' <<<"$output" >&2 || true
            sleep 10
          done
          exit 1

      # Building before the emulator starts keeps the build out of the drive
      # timeout below.
      - name: Build the test app
        run: flutter build apk --debug --target=${{ matrix.target }}

      # flutter drive sometimes cannot reach the app's VM Service through the
      # adb port forward and then retries forever, although the app runs. Each
      # attempt ends after 4 minutes, and a new attempt gets a new forward.
      # The device log of a failed run is saved for the artifact below.
      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tool/ci_integration_drive.sh ${{ matrix.target }}

      - name: Upload the device log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-${{ strategy.job-index }}
          path: logcat.txt
          if-no-files-found: ignore

  integration-result:
    name: Integration tests
    needs: [integration-targets, integration]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # The next push to this pull request reads this list to skip the tests
      # that passed here: those that ran and passed, and those carried over.
      - name: Record the passed integration tests
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIED: ${{ needs.integration-targets.outputs.carried }}
        run: |
          {
            jq -r '.[]' <<<"${CARRIED:-[]}"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
              -q '.jobs[] | select(.conclusion == "success") | .name' |
              sed -n 's/^Integration (\(.*\))$/\1/p'
          } | sort -u >passed.txt
          cat passed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: integration-passed
          path: passed.txt
          overwrite: true

      # "skipped" means that no selected test was affected by the change.
      - name: Check that every selected integration test passed
        env:
          LIST_RESULT: ${{ needs.integration-targets.result }}
          RUN_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$LIST_RESULT" != "success" ]; then
            echo "Listing integration tests: $LIST_RESULT" >&2
            exit 1
          fi
          case "$RUN_RESULT" in
            success | skipped) ;;
            *)
              echo "Integration tests: $RUN_RESULT" >&2
              exit 1
              ;;
          esac
