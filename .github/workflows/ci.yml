name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  unit:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: |
          flutter pub get
          (cd tools/architecture_lints && dart pub get)

      - name: Analyze
        run: flutter analyze lib test integration_test

      # `flutter analyze <directory>` does not report analyzer plugin lints
      # such as max_file_lines, so the changed files are analyzed one by one.
      - name: No new lints in changed files
        run: tool/ci_changed_file_lints.sh origin/${{ github.base_ref || 'master' }}

      - name: Unit and widget tests
        run: flutter test

  integration-targets:
    name: List integration tests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          targets=$(find integration_test -name '*_test.dart' | sort | jq -R . | jq -cs .)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (${{ matrix.target }})
    needs: integration-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.integration-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: flutter drive --driver=test_driver/integration_test.dart --target=${{ matrix.target }} -d emulator-5554

  integration-result:
    name: Integration tests
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every integration test passed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration tests: ${{ needs.integration.result }}" >&2
            exit 1
          fi
