name: CI

on:
  pull_request:
  # A release tag runs every integration test. A push to master runs one
  # integration test, only to fill the caches: GitHub Actions caches that
  # pull requests can read must be written on master.
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      all:
        description: Run every integration test
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  unit:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: |
          flutter pub get
          (cd tools/architecture_lints && dart pub get)

      - name: Analyze
        run: flutter analyze lib test integration_test

      # `flutter analyze <directory>` does not report analyzer plugin lints
      # such as max_file_lines, so the changed files are analyzed one by one.
      - name: No new lints in changed files
        run: tool/ci_changed_file_lints.sh origin/${{ github.base_ref || 'master' }}

      - name: Unit and widget tests
        run: flutter test

  integration-targets:
    name: List integration tests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pull requests run only the tests whose imports reach a changed file.
      - id: list
        env:
          RUN_ALL: ${{ github.ref_type == 'tag' || inputs.all == true }}
          WARM_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          BASE_REF: origin/${{ github.base_ref || 'master' }}
        run: |
          if [ "$RUN_ALL" = "true" ]; then
            targets=$(tool/ci_integration_targets.py --all)
          elif [ "$WARM_CACHE" = "true" ]; then
            targets=$(tool/ci_integration_targets.py --all | jq -c '.[:1]')
          else
            targets=$(tool/ci_integration_targets.py "$BASE_REF")
          fi
          echo "Selected integration tests: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (${{ matrix.target }})
    needs: integration-targets
    if: needs.integration-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.integration-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: flutter drive --driver=test_driver/integration_test.dart --target=${{ matrix.target }} -d emulator-5554

  integration-result:
    name: Integration tests
    needs: [integration-targets, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # "skipped" means that no selected test was affected by the change.
      - name: Check that every selected integration test passed
        env:
          LIST_RESULT: ${{ needs.integration-targets.result }}
          RUN_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$LIST_RESULT" != "success" ]; then
            echo "Listing integration tests: $LIST_RESULT" >&2
            exit 1
          fi
          case "$RUN_RESULT" in
            success | skipped) ;;
            *)
              echo "Integration tests: $RUN_RESULT" >&2
              exit 1
              ;;
          esac
