name: CI

# Pull requests run only analyze and the unit and widget tests, so they stay
# fast. The emulator tests run after the merge: a push to master runs the
# integration tests that the pushed commits affect, and the nightly run, a
# release tag and a manual run run all of them. A failed run after the merge
# opens an issue.
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A new push to a pull request cancels its old run. Every other run gets its
# own group, so no push, tag, nightly or manual run cancels another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  unit:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: |
          flutter pub get
          (cd tools/architecture_lints && dart pub get)

      - name: Analyze
        run: flutter analyze lib test integration_test

      # `flutter analyze <directory>` does not report analyzer plugin lints
      # such as max_file_lines, so the changed files are analyzed one by one.
      - name: No new lints in changed files
        run: tool/ci_changed_file_lints.sh origin/${{ github.base_ref || 'master' }}

      - name: Unit and widget tests
        run: flutter test

  integration-targets:
    name: List integration tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A push to master runs the tests whose imports reach a file that the
      # pushed commits changed. Without the previous commit, all tests run.
      - id: list
        env:
          RUN_ALL: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$RUN_ALL" = "true" ] ||
            ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            targets=$(tool/ci_integration_targets.py --all)
          else
            targets=$(tool/ci_integration_targets.py "$BEFORE_SHA")
          fi
          echo "Selected integration tests: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (${{ matrix.target }})
    needs: integration-targets
    if: needs.integration-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.integration-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # The emulator runner downloads the emulator and the system image
      # itself and fails on a broken download ("Error on ZipFile unknown
      # archive"). Installing both here first, with retries, makes the
      # runner's own install a no-op.
      - name: Install the Android emulator and system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          image='system-images;android-35;google_apis;x86_64'
          for attempt in 1 2 3; do
            if output=$("$sdkmanager" --install emulator "$image" --channel=0 2>&1) &&
              ! grep -q 'An error occurred' <<<"$output" &&
              [ -x "$ANDROID_HOME/emulator/emulator" ] &&
              [ -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64" ]; then
              exit 0
            fi
            echo "Android SDK install failed on attempt $attempt:" >&2
            grep -v '^\[' <<<"$output" >&2 || true
            sleep 10
          done
          exit 1

      # Building before the emulator starts keeps the build out of the drive
      # timeout below.
      - name: Build the test app
        run: flutter build apk --debug --target=${{ matrix.target }}

      # flutter drive sometimes cannot reach the app's VM Service through the
      # adb port forward and then retries forever, although the app runs. Each
      # attempt ends after 4 minutes, and a new attempt gets a new forward.
      # The device log of a failed run is saved for the artifact below.
      #
      # The emulator gets all 4 cores of the runner and more memory than the
      # profile's default, because it renders on the CPU and sometimes went
      # offline during a run.
      - name: Run on the Android emulator
        id: drive
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tool/ci_integration_drive.sh ${{ matrix.target }}

      # When the emulator went offline, the drive script leaves the file
      # emulator-crashed. The test then runs once more on a fresh emulator.
      # A test that failed on a running emulator is not run again.
      - name: Run again on a fresh emulator after an emulator crash
        id: drive-again
        if: steps.drive.outcome == 'failure' && hashFiles('emulator-crashed') != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tool/ci_integration_drive.sh ${{ matrix.target }}

      - name: Check the test result
        if: steps.drive.outcome == 'failure' && steps.drive-again.outcome != 'success'
        run: |
          echo "The integration test failed." >&2
          exit 1

      - name: Upload the device log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-${{ strategy.job-index }}
          path: logcat.txt
          if-no-files-found: ignore

  integration-result:
    name: Integration tests
    needs: [integration-targets, integration]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # "skipped" means that no selected test was affected by the change.
      - name: Check that every selected integration test passed
        env:
          LIST_RESULT: ${{ needs.integration-targets.result }}
          RUN_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$LIST_RESULT" != "success" ]; then
            echo "Listing integration tests: $LIST_RESULT" >&2
            exit 1
          fi
          case "$RUN_RESULT" in
            success | skipped) ;;
            *)
              echo "Integration tests: $RUN_RESULT" >&2
              exit 1
              ;;
          esac

      # The tests run after the merge, so a failure must not go unnoticed. One
      # open issue collects all failures until it is closed; a cancelled run
      # reports nothing.
      - name: Report the failed run in an issue
        if: failure() && needs.integration.result != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Integration tests failed after the merge'
          body="Failed after a $GITHUB_EVENT_NAME run on $GITHUB_REF_NAME at $GITHUB_SHA. Run: $RUN_URL"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label testing \
            --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label testing --body "$body"
          fi
