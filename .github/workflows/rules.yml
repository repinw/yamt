name: Security rules

# Runs the security rules tests (functions/test/rules) against the Firestore
# and Storage emulators whenever the rules or their tests change, on pull
# requests and on master. They also check that the rules keep allowing the
# write shapes of the app in the stores.
on:
  pull_request:
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - functions/test/rules/**
      - functions/src/**
      - functions/tsconfig*.json
      - functions/package.json
      - functions/package-lock.json
      - .github/workflows/rules.yml
  push:
    branches:
      - master
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - functions/test/rules/**
      - functions/src/**
      - functions/tsconfig*.json
      - functions/package.json
      - functions/package-lock.json
      - .github/workflows/rules.yml
  workflow_dispatch:

concurrency:
  group: rules-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The emulators run on Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the emulator downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.32.0
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.32.0
      - run: npm ci
      - name: Run the rules tests
        run: npm run test:rules
