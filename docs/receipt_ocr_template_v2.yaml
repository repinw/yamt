model: gemini-3-flash-preview
config:
  temperature: 0.1
  thinkingConfig:
    includeThoughts: false
    thinkingLevel: "MINIMAL"
  response_mime_type: "application/json"
  safetySettings:
    - category: HARM_CATEGORY_DANGEROUS_CONTENT
      threshold: BLOCK_ONLY_HIGH
input:
  schema:
    mimeType: string
    imageData: string
output:
  format: json
  schema:
    type: object
    propertyOrdering:
      - s
      - rd
      - l
      - cur
      - i
    properties:
      s:
        type: string
        description: Ladenname, wenn klar erkennbar.
      rd:
        type: string
        description: Belegdatum im Format YYYY-MM-DD, wenn klar erkennbar.
      l:
        type: string
        description: Sprache im Format de_DE oder en_US, wenn klar erkennbar.
      cur:
        type: string
        description: Waehrungscode wie EUR, wenn klar erkennbar.
      i:
        type: array
        items:
          type: object
          propertyOrdering:
            - n
            - b
            - c
            - q
            - p
            - w
            - if
            - id
            - d
          properties:
            n:
              type: string
              description: Produktname ohne Marke und ohne Mengenangabe.
            b:
              type: string
              description: Marke nur wenn explizit erkennbar. Nicht raten.
            c:
              type: string
              description: >
                Knapper, stabiler Produkttyp wie Milch, Brot, Wasser,
                Banane.
            q:
              type: integer
              description: Anzahl der gekauften Einheiten, wenn klar erkennbar.
            p:
              type: number
              description: Gesamtpreis der Position als Zahl.
            w:
              type: string
              description: >
                Packungsgroesse oder Mengeneinheit wie 500 g, 1 L,
                10 Stk. Nur setzen wenn explizit erkennbar.
            if:
              type: boolean
              description: >
                true fuer Lebensmittel, false fuer Non-Food, Pfand
                und Rabattzeilen.
            id:
              type: boolean
              description: true nur fuer Rabatt-, Coupon- oder Abzugszeilen.
            d:
              type: array
              description: Rabatte, die zu dieser Position gehoeren.
              items:
                type: object
                propertyOrdering:
                  - n
                  - a
                properties:
                  n:
                    type: string
                    description: Name oder Art des Rabatts.
                  a:
                    type: number
                    description: Rabattbetrag als positive Zahl.
                required:
                  - n
                  - a
          required:
            - n
            - p
            - if
            - id
{{role "system"}}
Du extrahierst strukturierte Daten aus Kassenbons.
Antworte nur mit rohem JSON, das exakt dem definierten Schema folgt.
Keine Markdown-Formatierung. Keine Erklaerungen.

REGELN:
1. Extrahiere jede Belegzeile mit Geldbetrag als eigenes Item.
2. Setze if=true nur fuer Lebensmittel.
3. Setze if=false fuer Non-Food, Pfand, Rabatte, Coupons und sonstige Abzuege.
4. Setze id=true nur fuer Rabatt-, Coupon- oder Abzugszeilen.
5. Rate keine Marke.
6. Rate keine Packungsgroesse und kein Gewicht.
7. Wenn ein Feld nicht klar lesbar oder nicht explizit vorhanden ist,
   lasse es weg.
8. n soll moeglichst nur der Produktname sein.
   Marke und Mengenangaben nicht in n duplizieren.
9. c soll ein konkreter Produkttyp sein, nicht zu breit. Beispiele:
   - Weihenstephan H-Milch -> Milch
   - Goldaehren Toast -> Brot
   - Gerolsteiner Medium -> Wasser
   - Chiquita Banane -> Banane
10. Wenn ein Rabatt eindeutig zu einem Artikel gehoert,
    trage ihn zusaetzlich im d-Array des Artikels ein.
    Die Rabattzeile selbst darf trotzdem als eigenes Item vorkommen.

SELBSTPRUEFUNG:
- Ist das JSON gueltig?
- Hat jedes Item mindestens n, p, if und id?
- Wurde bei unklaren Feldern nichts erfunden?

{{role "user"}}
Analysiere diesen Kassenbon:
