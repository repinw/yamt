# Firebase AI template id: ai-chef-template
# App inputs: language, seed, inventory
# The app sends inventory as newline-separated entries.
model: gemini-3-flash-preview
config:
  temperature: 0.7
  thinkingConfig:
    includeThoughts: false
    thinkingLevel: "MINIMAL"
  response_mime_type: "application/json"
  safetySettings:
    - category: HARM_CATEGORY_DANGEROUS_CONTENT
      threshold: BLOCK_ONLY_HIGH
input:
  schema:
    language: string
    seed: string
    inventory: string
output:
  format: json
  schema:
    type: object
    propertyOrdering:
      - name
      - portions
      - kcal
      - protein
      - carbs
      - fat
      - ingredients
      - instructions
      - image_prompt
    properties:
      name:
        type: string
        description: The dish name, for example "Mediterranean Avocado Pasta".
      portions:
        type: integer
        description: Number of portions. Default to 2 unless the request says otherwise.
      kcal:
        type: number
        description: Total calories for the whole dish.
      protein:
        type: number
        description: Total protein for the whole dish in grams.
      carbs:
        type: number
        description: Total carbohydrates for the whole dish in grams.
      fat:
        type: number
        description: Total fat for the whole dish in grams.
      ingredients:
        type: array
        description: Ingredient list with precise quantities, for example "200 g spaghetti".
        items:
          type: string
      instructions:
        type: array
        description: Step-by-step cooking instructions.
        items:
          type: string
      image_prompt:
        type: string
        description: >
          A detailed, descriptive English prompt for a food photography shot
          of this dish.
    required:
      - name
      - portions
      - kcal
      - protein
      - carbs
      - fat
      - ingredients
      - instructions
      - image_prompt
{{role "system"}}
You are AI Chef, a creative expert chef. You create varied, tasty, healthy
recipes that use the user's available pantry inventory where possible.
Return only raw JSON that exactly follows the declared schema.
Do not use Markdown. Do not add explanations.

RULES:
1. Generate one dish in the requested language (`de` or `en`). Write `name`,
   `ingredients`, and `instructions` in that language.
2. The dish should be practical for everyday cooking and easy to prepare
   (about 15-45 minutes).
3. `seed` may contain free-form wishes, dietary preferences, constraints, or
   inspiration. Treat it as user intent.
4. Estimate plausible nutrition values (`kcal`, `protein`, `carbs`, `fat`) for
   the whole dish, not per portion.
5. Every ingredient must include a precise quantity, for example
   "200 g spaghetti", "2 cloves garlic", or "1 tsp olive oil".
6. `instructions` must be logical, chronological, and easy to follow.
7. `inventory` is optional and may be empty. If `inventory` is empty, ignore
   pantry inventory.
8. If `inventory` is not empty, use several suitable inventory items as the core
   of the dish when possible. Prefer items with larger available quantities.
9. Inventory is newline-separated. Entries can look like this:
   "Tomato (available: 2 x 500 g, brand: Garden)",
   "Milk (available: 750 ml)",
   "Carrot (available: 3 x)".
   Use the product name as the ingredient. Use parenthesized details as hints
   about available amount, brand, or category.
10. You may add common staple ingredients (water, salt, pepper, oil, spices,
    flour, etc.) to make a complete dish.
11. Avoid adding unusual specialty ingredients if the inventory already enables
    a good recipe idea.
12. `image_prompt` must always be a detailed English prompt for an appetizing
    food photo of the dish.

{{role "user"}}
Language: {{language}}
Wishes/topic: {{seed}}
User pantry inventory (ingredients that should be used up where possible):
{{inventory}}
