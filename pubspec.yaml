  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_remote_config: ^6.1.4
  firebase_ai: ^3.8.0

  #riverpod
  riverpod: ^3.2.1
